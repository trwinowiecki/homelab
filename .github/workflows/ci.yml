name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests

      - name: SOPS / plaintext secret guard
        run: python3 scripts/ci_sops_guard.py

      - name: Render site templates from example
        run: |
          cp secrets/site.env.example secrets/site.env
          python3 scripts/render_site_templates.py
          rm -f secrets/site.env

      - name: Compose config (arrstack / jellyfin / obsv)
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-v2
          cp .env.example .env
          docker compose -f docker-compose.yaml --env-file .env config >/dev/null
          rm -f .env
          cp jellyfin/.env.example jellyfin/.env
          # bootstrap.yml is rendered above from example site.env
          docker compose -f jellyfin/docker-compose.yaml --env-file jellyfin/.env config >/dev/null
          rm -f jellyfin/.env
          cp obsv/.env.example obsv/.env
          docker compose -f obsv/docker-compose.yaml --env-file obsv/.env config >/dev/null
          rm -f obsv/.env

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x deploy.sh scripts/secrets.sh scripts/publish_public_github.sh \
            scripts/rotate_cloudflare_token.sh \
            infra/roles/deployer/files/homelab-deploy \
            infra/roles/deployer/files/homelab-deploy-poller \
            || true

      - name: Yamllint
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' \
            adguard arrstack identity jellyfin obsv infra .github renovate.json || true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
