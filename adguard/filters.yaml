# Desired AdGuard Home filter lists for CT 102.
# Identity is `url`. Applied by `./deploy.sh adguard`, which replaces only the
# `filters:` block in /opt/AdGuardHome/AdGuardHome.yaml (users, DHCP, and the
# rest of the live file are left untouched).
#
# HaGeZi Pro supersedes HaGeZi Normal — keep Normal disabled rather than
# stacked. OISD Big and Steven Black stay omitted; they overlap Pro the same
# way they overlapped Normal.
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_59.txt
    name: AdGuard DNS Popup Hosts filter
    id: 59
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_34.txt
    name: HaGeZi Normal Blocklist
    id: 34
  - enabled: true
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
    name: HaGeZi Pro DNS Blocklist
    id: 1001
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_3.txt
    name: Peter Lowe Blocklist
    id: 3
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_11.txt
    name: Malicious URL Blocklist (URLHaus)
    id: 11
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_44.txt
    name: HaGeZi Threat Intelligence Feeds
    id: 44
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2
