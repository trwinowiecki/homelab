lidarr:
  main:
    base_url: http://lidarr:8686
    api_key: !env LIDARR_API_KEY
    # Root folder /data/media/music already exists in Lidarr. Configarr rejects a
    # bare path here (it wants metadata + quality profile objects) and then skips
    # download clients entirely.
    download_clients:
      data:
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: sabnzbd
            port: 8080
            use_ssl: false
            url_base: ""
            api_key: !env SABNZBD_API_KEY
            username: ""
            password: ""
            music_category: music
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 2
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: gluetun
            port: 8200
            use_ssl: false
            url_base: /
            username: ""
            password: ""
            music_category: lidarr
      config:
        enable_completed_download_handling: true
        auto_redownload_failed: true
      delete_unmanaged:
        enabled: false
    delay_profiles:
      default:
        enableUsenet: true
        enableTorrent: true
        preferredProtocol: usenet
        usenetDelay: 0
        torrentDelay: 60
        bypassIfHighestQuality: false
        bypassIfAboveCustomFormatScore: false
        minimumCustomFormatScore: 0
