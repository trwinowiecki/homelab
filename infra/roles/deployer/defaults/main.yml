---
deployer_ctid: "{{ lookup('env', 'SITE_DEPLOYER_CTID') | default('105', true) }}"
deployer_hostname: deployer
deployer_cores: 1
deployer_memory_mb: 512
deployer_disk_gb: 8
deployer_timezone: America/New_York
deployer_repo_dir: /opt/homelab
deployer_repo_url: ""  # set in host_vars once the public GitHub URL exists
deployer_branch: main
deployer_age_key_src: "{{ playbook_dir }}/../.age/deployer.key"
deployer_allowed_signers_src: "{{ playbook_dir }}/../infra/roles/deployer/files/allowed_signers"
deployer_nightly_calendar: "*-*-* 02:00:00"
deployer_poll_interval_sec: 300
deployer_auto_targets:
  - arrstack
  - obsv
  - jellyfin
  - identity
  - pangolin/site
