---
- name: Ensure restic is installed on pve
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true

- name: Ensure restic password file exists (do not overwrite)
  ansible.builtin.file:
    path: /root/.restic-password
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Remind operator to init repo if needed
  ansible.builtin.debug:
    msg: >-
      restic password must live in the password manager. Init once with
      RESTIC_PASSWORD_FILE=/root/.restic-password restic -r /mnt/lxc_shares/metrion/backups/restic init
