# Error/warn log watching — consumed by obsv/log-watch.
# Per-container keys override defaults. mute: true skips spike, signature, and digest.
defaults:
  error_spike_threshold: 15
  error_spike_window: 5m
  include_warn_in_digest: true
  digest_hour: 8
  digest_minute: 0
  signature_lookback: 7d
  new_signature_min_count: 3
containers:
  log-watch:
    mute: true
  vector:
    mute: true
  discord-relay:
    mute: true
  victoria-logs:
    mute: true
  victoria-metrics:
    mute: true
  gluetun:
    error_spike_threshold: 40
    ignore:
      - "restarting VPN because it failed to pass the healthcheck"
