########################################################################
##  Pangolin server — control plane, tunnel endpoint, and reverse proxy
##
##  Runs on a public VPS, not in the homelab. Traefik shares Gerbil's
##  network namespace, so all published ports live on the gerbil service.
##
##  Deployed by ../deploy.sh. Do not edit this file on the VPS; edit it
##  here and redeploy, or the next deploy will overwrite the change.
##
##  Documentation: https://docs.pangolin.net/self-host/manual/docker-compose
########################################################################

name: pangolin

services:
  ####################################################################
  ##  Pangolin — dashboard, API, access control, SQLite state
  ####################################################################
  pangolin:
    image: docker.io/fosrl/pangolin:${PANGOLIN_VERSION:?err}
    container_name: pangolin
    restart: unless-stopped
    environment:
      ##  Maps to server.secret, which is therefore absent from config.yml.
      - SERVER_SECRET=${SERVER_SECRET:?err}
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  ####################################################################
  ##  Gerbil — WireGuard endpoint for sites (Newt) and clients (Olm).
  ##  Owns the host ports for the whole stack, including Traefik's.
  ####################################################################
  gerbil:
    image: docker.io/fosrl/gerbil:${GERBIL_VERSION:?err}
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp   # site tunnels
      - 21820:21820/udp   # client hole punch / relay
      - 443:443           # Traefik, via shared namespace
      - 80:80             # Traefik, ACME HTTP-01 challenge

  ####################################################################
  ##  Traefik — TLS termination and routing. Gets its routes from
  ##  Pangolin's HTTP provider, not from container labels.
  ####################################################################
  traefik:
    image: docker.io/traefik:${TRAEFIK_VERSION:?err}
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik

networks:
  default:
    driver: bridge
    name: pangolin
